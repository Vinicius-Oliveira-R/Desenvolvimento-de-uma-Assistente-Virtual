name: Backend audit validation

on:
  push:
    branches: [fix/auditoria-monografia-seguranca-agenda]
  pull_request:
    branches: [main]
    paths:
      - 'app/backend/**'
      - 'alembic/**'
      - 'create_gestor.py'
      - 'scripts/**'
      - '.github/workflows/backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: clinico_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d clinico_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-not-for-production-44ca562370d228f2ef6ea0587ce67591
      DATABASE_URL: sqlite:////tmp/clinico_audit_test.db
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/clinico_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Archive reviewed source for reproducibility
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt
      - name: Record environment
        run: |
          python --version > evidence/python.txt
          python -m pip freeze > evidence/dependencies.txt
          python -m pip check
      - name: Backend tests (disposable SQLite and PostgreSQL only)
        run: |
          set -o pipefail
          python -m pytest app/backend/tests -q --junitxml=evidence/backend.xml 2>&1 | tee evidence/backend.txt
      - name: Reproduce classifier evaluation
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python -m app.backend.ml.train --output evidence/classifier.json 2>&1 | tee evidence/classifier.txt
      - name: Save audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit-${{ github.sha }}
          path: evidence/
          retention-days: 7
