name: Backend scheduling validation

on:
  push:
    branches: [main]
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-agendamento.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-agendamento.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backend_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-for-production-83109ed6ca047f3423c9f021a17e2202
      DATABASE_URL: sqlite:////tmp/assistente_clinico_test.db
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:local-ci-only@127.0.0.1:5432/backend_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test backend with disposable database fixtures
        run: python -m pytest app/backend/tests -q --junitxml=backend-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend-results.xml
          retention-days: 7
