name: Backend scheduling validation

on:
  push:
    branches: [fix/agendamento-intencoes-e-disponibilidade]
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-agendamento.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-not-for-production-83109ed6ca047f3423c9f021a17e2202
      DATABASE_URL: sqlite:////tmp/assistente_clinico_test.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare offline test helpers
        run: python -m pip download --only-binary=:all: --dest test-wheels bcrypt==4.1.2 python-jose==3.3.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduling-test-wheels
          path: test-wheels/*.whl
          retention-days: 1
      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test backend with disposable SQLite fixtures
        run: python -m pytest app/backend/tests -q --junitxml=backend-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend-results.xml
          retention-days: 7
