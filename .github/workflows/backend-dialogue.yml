name: Backend dialogue validation

on:
  push:
    branches: [fix/agendamento-linguagem-simples]
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend-dialogue.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-dialogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/assistente_clinico_ci.db
      SECRET_KEY: ci-only-not-a-production-secret-dialogue-validation
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Archive reviewed backend sources (no secrets or databases)
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', 'app/backend']).decode().split('\0')
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'], 'backend-source.zip'), 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  if name and pathlib.Path(name).suffix in {'.py', '.csv', '.txt'} and '.env' not in pathlib.Path(name).name:
                      archive.write(name, name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-source
          path: ${{ runner.temp }}/backend-source.zip
          retention-days: 3
      - name: Install backend dependencies
        run: python -m pip install -r app/backend/requirements.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Test backend and scheduling dialogues
        run: python -m pytest app/backend/tests -q --junitxml=backend-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-test-results
          path: backend-results.xml
          if-no-files-found: ignore
          retention-days: 7
