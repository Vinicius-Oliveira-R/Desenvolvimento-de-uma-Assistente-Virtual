{% extends 'base.html' %}

{% block title %}Chat - Assistente Clínico{% endblock %}

{% block content %}
<div class="chat-container">
    <div id="chat-feed" class="chat-feed">
        <!-- Mensagem de Boas-Vindas Inicial -->
        <div class="chat-bubble assistant">
            <div class="avatar"><i class="bi bi-robot"></i></div>
            <div class="message-content">
                Olá! Sou o seu Assistente Clínico. Como posso ajudar com o seu agendamento hoje?
            </div>
        </div>
    </div>

    <div id="digitando" class="htmx-indicator chat-typing">
        <i class="bi bi-three-dots me-1"></i> Assistente digitando...
    </div>

    <!-- Campo de Entrada HTMX -->
    <div class="chat-input-container">
        <form id="chat-form"
              class="chat-form"
              x-data
              hx-post="{% url 'chat' %}"
              hx-target="#chat-feed"
              hx-swap="beforeend"
              hx-indicator="#digitando"
              hx-disabled-elt="#chat-form button"
              hx-on::after-request="this.reset(); document.getElementById('chat-feed').scrollTop = document.getElementById('chat-feed').scrollHeight;">
            {% csrf_token %}
            <textarea name="message"
                      placeholder="Digite sua mensagem aqui..."
                      maxlength="500"
                      required
                      @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); $el.form.requestSubmit(); }"></textarea>
            <button type="submit" class="btn-send" aria-label="Enviar mensagem">
                <i class="bi bi-send-fill"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
